      *{

        display: flex;

        padding: 20px;

      }
      article {
        height: 450px;
        width: 300px;
        padding: 10px;
        border: 1px solid gray;
        border-radius: 20px;
        display: flex;
        align-items: start;
        justify-content: space-evenly;
        flex-direction: column;
      }
      img {
        height: 50%;
        width: 100%;
        border-radius: 20px;
      }
      button {
        width: 100%;
        border-radius: 20px;
        font-size: 20px;
        font-weight: 500;
        padding: 10px 0;
      }
      p {
        font-size: 20px;
        font-weight: 500;
      }
